[project]
name = "llm-ft"
version = "0.1.0"
description = "LLM LoRA fine-tuning with GPU profiling for DGX Spark"
requires-python = ">=3.11,<3.14"

dependencies = [
    "torch>=2.7",
    "transformers",
    "peft",
    "datasets",
    "accelerate",
    "pytorch-lightning",
    "tensorboard",
]

[project.optional-dependencies]
qlora = ["bitsandbytes"]

[tool.uv]
# PyTorch CUDA 13.0 index — required for Blackwell GPUs (sm_120/sm_121).
# Has x86_64 wheels only. On aarch64 (DGX Spark), uv falls back to PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
