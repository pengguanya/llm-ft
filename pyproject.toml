[project]
name = "llm-ft"
version = "0.1.0"
description = "LLM LoRA fine-tuning with GPU profiling for DGX Spark"
requires-python = ">=3.11,<3.14"

dependencies = [
    "torch>=2.2",
    "transformers>=4.40,<5",
    "peft",
    "datasets",
    "accelerate",
    "pytorch-lightning",
    "tensorboard",
]

[project.optional-dependencies]
qlora = ["bitsandbytes"]

[tool.uv]
# PyTorch CUDA 12.4 index — has x86_64 wheels only.
# On aarch64 (DGX Spark), uv falls back to PyPI automatically.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
