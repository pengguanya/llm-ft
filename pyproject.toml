[project]
name = "llm-ft"
version = "0.1.0"
description = "LLM LoRA fine-tuning with GPU profiling for DGX Spark"
requires-python = ">=3.11,<3.14"

dependencies = [
    "torch>=2.7",
    "transformers",
    "peft",
    "datasets",
    "accelerate",
    "pytorch-lightning",
    "tensorboard",
]

[project.optional-dependencies]
qlora = ["bitsandbytes"]

[tool.uv]
# PyTorch CUDA 13.0 index for x86_64 (Blackwell sm_120 support).
# On aarch64 (DGX Spark), torch is pre-installed in the NGC container
# or system — setup_env.sh uses --no-install-package torch to skip it.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
